<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>🛸 Crew Cockpit</title>
<style>
:root{
  --bg:#070a12;--panel:#0e1320;--panel2:#141a2b;--border:#1f2740;
  --text:#eaf0ff;--muted:#7c89a8;--dim:#4a5670;
  --green:#22c55e;--amber:#fbbf24;--red:#f87171;--cyan:#00d4ff;
  --font:'Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(circle at 20% 0%,rgba(0,212,255,.06),transparent 45%),
  radial-gradient(circle at 90% 100%,rgba(108,99,255,.06),transparent 40%);pointer-events:none;z-index:0;}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:50;background:rgba(7,10,18,.85);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:16px 26px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.brand{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;}
.brand b{background:linear-gradient(135deg,#a8e0ff,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hdr-stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 15px;min-width:78px;}
.stat-n{font-size:19px;font-weight:800;line-height:1;}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:3px;}
.live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{opacity:.6;box-shadow:0 0 0 5px rgba(34,197,94,0)}}

.wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:22px 26px 80px;}
.layout{display:grid;grid-template-columns:1fr 340px;gap:22px;}
@media(max-width:1040px){.layout{grid-template-columns:1fr}}

.section-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px;display:flex;align-items:center;gap:8px;}

/* ── AGENT GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;}
.card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--border);
  border-radius:18px;padding:18px;position:relative;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac);opacity:.85;}
.card:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 16px 40px rgba(0,0,0,.45);}
.card-top{display:flex;align-items:center;gap:13px;margin-bottom:15px;}
.av{width:52px;height:52px;border-radius:14px;overflow:hidden;background:var(--panel2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;position:relative;}
.av img{width:100%;height:100%;object-fit:cover;}
.status-ring{position:absolute;inset:-3px;border-radius:16px;border:2px solid transparent;}
.online .status-ring{border-color:var(--green);animation:pulse 2.5s infinite;}
.card-id{flex:1;min-width:0;}
.card-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}
.dot.off{background:var(--dim);}
.card-title{font-size:11px;color:var(--ac);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.voice-btn{background:var(--panel2);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;
  border-radius:10px;cursor:pointer;font-size:15px;flex-shrink:0;transition:all .15s;display:flex;align-items:center;justify-content:center;}
.voice-btn:hover{border-color:var(--ac);color:var(--text);transform:scale(1.08);}
.voice-btn:active{transform:scale(.92);}

.meta-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.chip{font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.04);
  border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;gap:5px;}
.chip.paid{color:var(--amber);border-color:rgba(251,191,36,.25);background:rgba(251,191,36,.07);}
.chip.local{color:var(--green);border-color:rgba(34,197,94,.22);background:rgba(34,197,94,.06);}

.bars{display:flex;flex-direction:column;gap:9px;}
.bar-row{display:flex;align-items:center;gap:10px;}
.bar-lbl{font-size:11px;color:var(--muted);width:62px;flex-shrink:0;}
.bar-track{flex:1;height:6px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;display:flex;}
.bar-seg{height:100%;}
.bar-val{font-size:11px;color:var(--text);font-weight:600;width:74px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
.legend{display:flex;gap:12px;margin-top:13px;padding-top:13px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:4px;}
.lg-dot{width:7px;height:7px;border-radius:2px;}

/* ── INSIGHTS RAIL ── */
.rail{display:flex;flex-direction:column;gap:16px;}
.panel{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:18px;padding:18px;}
.ins-list{display:flex;flex-direction:column;gap:9px;max-height:560px;overflow-y:auto;}
.ins{display:flex;gap:11px;padding:11px 12px;border-radius:12px;background:rgba(255,255,255,.03);
  border:1px solid var(--border);border-left-width:3px;cursor:default;transition:background .15s;}
.ins:hover{background:rgba(255,255,255,.06);}
.ins.high{border-left-color:var(--red);}
.ins.med{border-left-color:var(--amber);}
.ins.low{border-left-color:var(--dim);}
.ins-ico{font-size:17px;flex-shrink:0;line-height:1.3;}
.ins-txt{font-size:12.5px;line-height:1.5;color:var(--text);}
.ins-txt b{font-weight:700;}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0;}

.budget-big{font-size:34px;font-weight:800;color:var(--green);text-shadow:0 0 22px rgba(34,197,94,.3);letter-spacing:-.02em;}
.budget-sub{font-size:11px;color:var(--muted);margin-top:3px;}

.foot{text-align:center;color:var(--dim);font-size:12px;margin-top:40px;}
.spin{display:inline-block;animation:spin 9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="spin">🛸</span> Crew <b>Cockpit</b></div>
  <div class="live"><span class="live-dot"></span> <span id="live-txt">live · refreshing every 10s</span></div>
  <div class="hdr-stats">
    <div class="stat"><div class="stat-n" id="s-online">—</div><div class="stat-l">Online</div></div>
    <div class="stat"><div class="stat-n" id="s-agents">—</div><div class="stat-l">Agents</div></div>
    <div class="stat"><div class="stat-n" id="s-tasks">—</div><div class="stat-l">Open Tasks</div></div>
    <div class="stat"><div class="stat-n" id="s-budget" style="color:var(--green)">—</div><div class="stat-l">Credit</div></div>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <div>
      <div class="section-t">⬡ Crew Status</div>
      <div class="grid" id="grid"><div class="empty">Loading crew…</div></div>
    </div>
    <div class="rail">
      <div>
        <div class="section-t">💡 Growth Insights</div>
        <div class="panel"><div class="ins-list" id="insights"><div class="empty">Analyzing…</div></div></div>
      </div>
      <div>
        <div class="section-t">💳 Budget</div>
        <div class="panel">
          <div class="budget-big" id="budget-big">—</div>
          <div class="budget-sub" id="budget-sub"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="foot">🛸 Crew Cockpit · localhost:4000 · data pulled live from OpenClaw + workspaces</div>
</div>

<script>
const AV='avatars';
let lastData=null;

async function load(){
  try{
    const r=await fetch('/api/crew');
    const d=await r.json();
    lastData=d;
    render(d);
    document.getElementById('live-txt').textContent='live · updated '+new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById('live-txt').textContent='⚠ backend offline — is server.js running?';
  }
}

function fmtBytes(b){if(b<1024)return b+' B';if(b<1048576)return (b/1024).toFixed(1)+' KB';return (b/1048576).toFixed(1)+' MB';}

function render(d){
  const online=d.agents.filter(a=>a.online).length;
  const openTasks=d.agents.reduce((s,a)=>s+a.tasks.queue+a.tasks.progress,0);
  document.getElementById('s-online').textContent=online;
  document.getElementById('s-agents').textContent=d.agents.length;
  document.getElementById('s-tasks').textContent=openTasks;
  document.getElementById('s-budget').textContent=d.budget.balance!=null?'$'+d.budget.balance:'—';
  document.getElementById('budget-big').textContent=d.budget.balance!=null?'$'+d.budget.balance.toFixed(2):'Not set';
  document.getElementById('budget-sub').textContent=d.budget.lastUpdated?'as of '+new Date(d.budget.lastUpdated).toLocaleDateString():'';

  const grid=document.getElementById('grid');grid.innerHTML='';
  d.agents.forEach(a=>grid.appendChild(card(a)));

  const ins=document.getElementById('insights');
  if(!d.insights.length){ins.innerHTML='<div class="empty">✨ All clear — no growth nudges right now.</div>';}
  else{ins.innerHTML='';d.insights.forEach(i=>{
    const el=document.createElement('div');el.className='ins '+i.sev;
    el.innerHTML='<span class="ins-ico">'+i.icon+'</span><div class="ins-txt">'+esc(i.text)+'</div>';
    ins.appendChild(el);
  });}
}

function card(a){
  const c=document.createElement('div');
  c.className='card'+(a.online?' online':'');
  c.style.setProperty('--ac',a.color);
  const t=a.tasks, totalT=Math.max(t.total,1);
  const qp=(t.queue/totalT*100), pp=(t.progress/totalT*100), dp=(t.done/totalT*100);
  const modelChip=a.model==='—'?'<span class="chip">no model</span>'
    :'<span class="chip '+(a.paid?'paid':'local')+'">'+(a.paid?'💵':'⚡')+' '+esc(a.model)+'</span>';
  c.innerHTML=
    '<div class="card-top">'+
      '<div class="av"><div class="status-ring"></div>'+
        '<img src="'+AV+'/'+a.id+'.jpg" onerror="this.style.display=\'none\';this.parentNode.insertAdjacentText(\'beforeend\',\''+a.emoji+'\')"/>'+
      '</div>'+
      '<div class="card-id">'+
        '<div class="card-name"><span class="dot '+(a.online?'on':'off')+'"></span>'+esc(a.name)+'</div>'+
        '<div class="card-title">'+esc(a.title)+'</div>'+
      '</div>'+
      '<button class="voice-btn" title="Hear '+esc(a.name)+'" onclick="speak(\''+a.id+'\')">🔊</button>'+
    '</div>'+
    '<div class="meta-row">'+
      modelChip+
      '<span class="chip">'+(a.online?'🟢 online':'⚪ '+esc(a.lastActive))+'</span>'+
      '<span class="chip">🧩 '+a.skills+' skills</span>'+
      '<span class="chip">🧠 '+fmtBytes(a.memBytes)+'</span>'+
    '</div>'+
    '<div class="bars">'+
      '<div class="bar-row"><span class="bar-lbl">Tasks</span>'+
        '<div class="bar-track">'+
          '<div class="bar-seg" style="width:'+dp+'%;background:var(--green)"></div>'+
          '<div class="bar-seg" style="width:'+pp+'%;background:var(--amber)"></div>'+
          '<div class="bar-seg" style="width:'+qp+'%;background:var(--dim)"></div>'+
        '</div>'+
        '<span class="bar-val">'+t.done+'/'+t.total+' done</span>'+
      '</div>'+
      '<div class="bar-row"><span class="bar-lbl">Sessions</span>'+
        '<div class="bar-track"><div class="bar-seg" style="width:'+Math.min(a.sessions*12,100)+'%;background:var(--cyan)"></div></div>'+
        '<span class="bar-val">'+a.sessions+' run'+(a.sessions===1?'':'s')+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="legend">'+
      '<span><span class="lg-dot" style="background:var(--green)"></span>Done</span>'+
      '<span><span class="lg-dot" style="background:var(--amber)"></span>In progress</span>'+
      '<span><span class="lg-dot" style="background:var(--dim)"></span>Queued</span>'+
    '</div>';
  return c;
}

async function speak(agentId){
  const a=lastData?.agents.find(x=>x.id===agentId);if(!a)return;
  const t=a.tasks;
  let line;
  if(a.sessions===0) line=a.name+' here. I haven\'t been activated yet. Give me my first task and I\'ll come online.';
  else line=a.name+' reporting. '+t.done+' tasks done, '+t.queue+' still queued. '+(a.online?'I\'m online and ready.':'Standing by.');
  try{await fetch('/api/say',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({agentId,text:line})});}catch{}
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

load();
setInterval(load,10000);
</script>
</body>
</html>
